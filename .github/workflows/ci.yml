name: CI

# Tests on every pull request and on main. Deliberately Docker-free: the
# image is built only when a release is tagged, so this is what stands
# between a change and main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # xelatex is not installed here, so the render tests that need it skip
      # themselves. Everything else — schema validation, error shapes, the
      # concurrency cap — runs. The full render path is covered by the smoke
      # test in the release workflow.
      - name: Run tests
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q -rs
