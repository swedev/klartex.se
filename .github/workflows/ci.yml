name: CI

# Tests on every pull request and on main. Deliberately Docker-free: the
# image is built only when a release is tagged, so this is what stands
# between a change and main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The migration suite runs against the real dialect: parla's schema,
    # `pg_advisory_xact_lock` and uuid keys are Postgres-only, so a suite
    # that passed against SQLite would say nothing about production. The
    # container is throwaway — tests/test_migrations.py drops and recreates
    # the public schema.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: klartex
          POSTGRES_PASSWORD: klartex
          POSTGRES_DB: klartex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klartex -d klartex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://klartex:klartex@localhost:5432/klartex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # KLARTEX_VERSION is not a version of its own: it names the render
      # image the deploy pulls, and that has to be the core the backend
      # was built and tested against. The pin in pyproject.toml is the
      # source; .env.example only carries it to the server.
      - name: klartex pin matches KLARTEX_VERSION
        run: |
          pin=$(python3 -c "
          import re, tomllib
          deps = tomllib.load(open('backend/pyproject.toml','rb'))['project']['dependencies']
          print(next(re.fullmatch(r'klartex==(.+)', d).group(1) for d in deps if d.startswith('klartex==')))
          ")
          env=$(sed -n 's/^KLARTEX_VERSION=//p' infra/.env.example)
          echo "pyproject: $pin, .env.example: $env"
          if [[ "$pin" != "$env" ]]; then
            echo "backend/pyproject.toml pins klartex==$pin but infra/.env.example says KLARTEX_VERSION=$env" >&2
            exit 1
          fi

      # xelatex is not installed here, so the tests that need it skip
      # themselves. Everything else — schema validation, error shapes, the
      # in-flight cap, the backend → render contract driven in-process
      # against klartex.server, and the migrations against the service
      # container above — runs. The full render path is covered by the
      # two-container smoke test in the release workflow.
      - name: Run tests
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q -rs
