name: Release

# One tag releases one service. `v*` builds and rolls out the backend (the
# app: policy, discovery, the page-template registry, /api); `render-v*`
# does the same for the render service (the LaTeX compiler). The two carry
# independent version series so a product release never has to move the
# ~9 GB TeX base through CI again.
#
# Either tag builds the image, smoke-tests it, publishes it, and rolls it
# out to the production server — in that order, in one run. Nothing is built
# on a push to main: main takes ordinary work without side effects, and an
# image exists only because a release was cut.
#
# workflow_dispatch from a tag re-runs that release (rollback). The build is
# reproducible from the tagged tree, so it produces the same image.
#
# The frontend at app.klartex.se is not deployed here. ~/app is fed from
# app/dist, and the source that builds it lives on the unmerged #14 branch
# rather than on main, so a CI checkout has nothing to build. Once #14
# lands, building and syncing app/dist belongs in this workflow.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'render-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Never interleave two deploys on the server. Queued runs wait rather than
# cancel: a v0.2.4 push right after v0.2.3 should deploy both, in order.
# The two version series share the group — a render deploy and a backend
# deploy must not touch the server's .env at the same time.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve target from tag
    # Tag guard: the dispatch UI preselects the default branch, and an
    # untagged build must never reach production.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      service: ${{ steps.target.outputs.service }}
      version: ${{ steps.target.outputs.version }}
      image: ${{ steps.target.outputs.image }}
      env_var: ${{ steps.target.outputs.env_var }}
    steps:
      - uses: actions/checkout@v4

      # The tag names both the service and its version, and the version has
      # to match the pyproject.toml of that service — a tag can point at any
      # commit, including one whose version was never bumped.
      - name: Derive service and version
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            render-v*)
              service=render
              version="${GITHUB_REF_NAME#render-v}"
              image=ghcr.io/swedev/klartex-se-render
              env_var=RENDER_VERSION
              ;;
            v*)
              service=backend
              version="${GITHUB_REF_NAME#v}"
              image=ghcr.io/swedev/klartex-se-backend
              env_var=BACKEND_VERSION
              ;;
            *)
              echo "tag $GITHUB_REF_NAME names no service (expected v* or render-v*)" >&2
              exit 1
              ;;
          esac

          declared=$(python3 -c "import sys, tomllib; print(tomllib.load(open(sys.argv[1],'rb'))['project']['version'])" "$service/pyproject.toml")
          if [[ "$version" != "$declared" ]]; then
            echo "tag $GITHUB_REF_NAME does not match $service/pyproject.toml version $declared" >&2
            exit 1
          fi

          {
            echo "service=$service"
            echo "version=$version"
            echo "image=$image"
            echo "env_var=$env_var"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $service $version as $image:$version"

  build:
    name: Build and publish image
    needs: resolve
    # Publishing to GHCR needs more than the workflow's read-only default.
    # Scoped to this job so the deploy job keeps read-only credentials.
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERVICE: ${{ needs.resolve.outputs.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # CI already ran these on the pull request. Running them again here
      # binds the tested tree to the published image.
      - name: Install
        working-directory: ./${{ needs.resolve.outputs.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # The backend's contract test drives the render service in-process.
      - name: Install the render service for the contract test
        if: needs.resolve.outputs.service == 'backend'
        run: pip install -e ./render

      - name: Run tests
        working-directory: ./${{ needs.resolve.outputs.service }}
        run: pytest -q

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 first, loaded into the runner so it can actually be run before
      # anything is pushed. This is what catches a missing LaTeX package or a
      # broken PATH — failures a successful `docker build` does not reveal.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ needs.resolve.outputs.service }}
          platforms: linux/amd64
          load: true
          tags: smoke-test:amd64

      # The render service is smoke-tested alone; the backend is smoke-tested
      # against a real one, since it compiles nothing itself and would
      # otherwise only prove that it can answer 502.
      - name: Smoke-test (render a minimal block-engine PDF)
        run: |
          wait_for() {
            for i in $(seq 1 30); do
              if curl -fsS "$1" >/dev/null 2>&1; then
                echo "✓ $1 up after ${i}s"; return 0
              fi
              sleep 1
            done
            echo "$1 never came up"
            return 1
          }

          if [ "$SERVICE" = render ]; then
            docker run -d --name smoke -p 18000:8000 smoke-test:amd64
            health=http://localhost:18000/health
            render=http://localhost:18000/render
          else
            # The version infra/.env.example pins is the one production runs,
            # so this is the pairing the release is deployed as. The container
            # is named `render` because that is the host the backend defaults
            # to on the compose network.
            render_version=$(sed -n 's/^RENDER_VERSION=//p' infra/.env.example)
            echo "pairing the backend with klartex-se-render:$render_version"
            docker network create smoke-net
            docker run -d --name render --network smoke-net \
              "ghcr.io/swedev/klartex-se-render:$render_version"
            docker run -d --name smoke --network smoke-net -p 18000:8000 \
              smoke-test:amd64
            health=http://localhost:18000/api/health
            render=http://localhost:18000/api/render
          fi

          dump_logs() {
            echo "--- $SERVICE logs ---"; docker logs smoke
            if [ "$SERVICE" != render ]; then
              echo "--- render logs ---"; docker logs render
            fi
          }

          wait_for "$health" || { dump_logs; exit 1; }
          curl -fsS "$health"

          if [ "$SERVICE" != render ]; then
            # Discovery answers from the backend's own core, and it has to be
            # the core that renders. The pins job in ci.yml keeps them equal;
            # this is the running proof.
            curl -fsS http://localhost:18000/api/templates | grep -q '"_block"' || {
              echo "/api/templates does not list _block"; dump_logs; exit 1;
            }
            backend_core=$(curl -fsS "$health" | jq -r .klartex)
            render_core=$(docker exec render curl -fsS http://localhost:8000/health | jq -r .klartex)
            if [ "$backend_core" != "$render_core" ]; then
              echo "klartex differs: backend $backend_core, render $render_core"
              exit 1
            fi
            echo "✓ both services on klartex $backend_core"

            # The anonymous tier may not send raw LaTeX. A 403 here is the
            # policy layer answering before anything reaches the compiler.
            code=$(curl -s -o /tmp/latex.json -w '%{http_code}' \
              -X POST "$render" -H "Content-Type: application/json" \
              -d '{"template":"_block","data":{"body":[{"type":"latex","body":"\\hrule"}]}}')
            if [ "$code" != "403" ]; then
              echo "anonymous latex block answered HTTP $code, expected 403"
              cat /tmp/latex.json; dump_logs; exit 1
            fi
            echo "✓ anonymous latex block refused with 403"
          fi

          code=$(curl -s -o /tmp/out.pdf -w '%{http_code}' \
            -X POST "$render" \
            -H "Content-Type: application/json" \
            -d '{"template":"_block","data":{"lang":"sv","body":[{"type":"heading","text":"CI smoke"},{"type":"text","text":"verifies xelatex + all sty files load"}]}}')
          echo "render HTTP $code"
          if [ "$code" != "200" ]; then
            dump_logs
            echo "--- response ---"; cat /tmp/out.pdf
            exit 1
          fi
          head -c 4 /tmp/out.pdf | grep -q '%PDF' || {
            echo "Response is not a PDF"; head -c 200 /tmp/out.pdf; exit 1;
          }
          echo "✓ render produced $(stat -c%s /tmp/out.pdf) bytes of PDF"
          docker stop smoke

      # Only after the smoke test passes does anything reach the registry.
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ needs.resolve.outputs.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ needs.resolve.outputs.version }}
            ${{ needs.resolve.outputs.image }}:latest

  deploy:
    name: Deploy to production
    needs: [resolve, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The host key is pinned via the SSH_KNOWN_HOSTS secret rather than
      # trusting whatever ssh-keyscan returns at deploy time. To rotate
      # (e.g. after a server rebuild), verify the fingerprint against the
      # server's /etc/ssh/ssh_host_*_key.pub, then:
      #   ssh-keyscan -H <host> | gh secret set SSH_KNOWN_HOSTS
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 0700 ~/.ssh
          test -n "$DEPLOY_SSH_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts

      # infra/.env is deliberately excluded: it is gitignored, so it does not
      # exist in this checkout, and --delete would otherwise remove the
      # server's copy and take the stack down. The version variables are
      # written on the server instead, in the deploy step below. rsync
      # protects excluded paths from --delete, so the server's .env survives
      # untouched.
      - name: Sync infra and landing page
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

          ssh $SSH_OPTS "klartex@$HOST" \
            'if [[ ! -f /home/klartex/klartex/.env ]]; then
               echo "/home/klartex/klartex/.env is missing — create it on the server once, see infra/README.md" >&2
               exit 1
             fi
             umask 022; mkdir -p /home/klartex/deploy-backup
             rm -rf /home/klartex/deploy-backup/*
             for f in docker-compose.yml Caddyfile .env; do
               [[ -f "/home/klartex/klartex/$f" ]] && cp "/home/klartex/klartex/$f" /home/klartex/deploy-backup/
             done
             [[ -d /home/klartex/klartex/caddy ]] && cp -r /home/klartex/klartex/caddy /home/klartex/deploy-backup/
             echo "  backed up running config"'

          rsync -av --delete -e "ssh $SSH_OPTS" \
            --exclude=.env \
            --exclude=caddy-data --exclude=caddy-config --exclude=page-templates \
            infra/ "klartex@$HOST:/home/klartex/klartex/"

          rsync -av --delete -e "ssh $SSH_OPTS" \
            --include='index.html' --include='llms.txt' \
            --include='assets/' --include='assets/*.svg' \
            --include='assets/fonts/' --include='assets/fonts/*.woff2' \
            --include='assets/fonts/*-OFL.txt' --exclude='*' \
            ./ "klartex@$HOST:/home/klartex/site/"

      - name: Build Caddy, preflight, and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SERVICE: ${{ needs.resolve.outputs.service }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ENV_VAR: ${{ needs.resolve.outputs.env_var }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "klartex@$HOST" "export SERVICE='$SERVICE' VERSION='$VERSION' ENV_VAR='$ENV_VAR' && bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd /home/klartex/klartex

          # The image id behind klartex-se-caddy:local before this deploy
          # rebuilds it. Empty on the first deploy, when the tag does not
          # exist yet.
          prev_caddy_image="$(docker image inspect --format '{{.Id}}' klartex-se-caddy:local 2>/dev/null || true)"
          restarted=0

          restore() {
              trap - ERR
              echo "✗ deploy failed — restoring config from /home/klartex/deploy-backup"
              cp /home/klartex/deploy-backup/docker-compose.yml \
                 /home/klartex/deploy-backup/Caddyfile \
                 /home/klartex/deploy-backup/.env /home/klartex/klartex/
              rm -rf /home/klartex/klartex/caddy
              if [[ -d /home/klartex/deploy-backup/caddy ]]; then
                  cp -r /home/klartex/deploy-backup/caddy /home/klartex/klartex/
              fi
              # A completed build has already moved klartex-se-caddy:local to
              # the new image. Restoring the old Dockerfile does not undo that
              # — `up -d` never rebuilds — so point the tag back at the image
              # that was running, or the restored Caddyfile would start on the
              # new binary.
              if [[ -n "$prev_caddy_image" ]]; then
                  docker image tag "$prev_caddy_image" klartex-se-caddy:local
              fi
              if [[ "$restarted" == 1 ]]; then
                  sudo systemctl restart klartex-stack.service
              else
                  echo "  stack was never stopped — running containers are untouched"
              fi
              exit 1
          }
          trap restore ERR

          # Record the version in .env so the systemd unit's `docker compose
          # up -d` resolves the deployed image rather than the previous one.
          # Only this release's variable is touched; the other service keeps
          # whatever version it is running.
          sed -i "/^${ENV_VAR}=/d" .env
          printf '%s=%s\n' "$ENV_VAR" "$VERSION" >> .env

          # The caddy image is built here, not pulled: `docker compose pull`
          # alone would try to fetch klartex-se-caddy:local from a registry.
          # A compose file referencing a version the server's .env does not
          # carry fails here — before anything is stopped.
          if docker compose pull --help | grep -q -- --ignore-buildable; then
              docker compose pull --ignore-buildable
          else
              docker compose pull backend render
          fi

          # The systemd unit runs `docker compose up -d`, which does not
          # rebuild on a changed Dockerfile — build explicitly.
          docker compose build --pull caddy

          # Preflight the new binary and config before the running stack is
          # stopped. `docker compose run` keeps the service's container_name
          # and would collide with the running caddy container, so the built
          # image is exercised directly.
          docker run --rm klartex-se-caddy:local \
              caddy list-modules | grep -q 'http\.handlers\.rate_limit'
          docker run --rm -v /home/klartex/klartex/Caddyfile:/etc/caddy/Caddyfile:ro klartex-se-caddy:local \
              caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          restarted=1
          sudo systemctl restart klartex-stack.service
          sleep 5
          docker compose ps
          running="$(docker compose ps --services --filter status=running)"
          for svc in backend render caddy; do
              grep -qx "$svc" <<<"$running" || {
                  echo "service $svc is not running after restart"
                  false
              }
          done

          # The version the released service actually reports has to match
          # what was deployed — a stale container would otherwise pass the
          # checks above. render publishes no port, so it is asked from
          # inside its own container.
          health_of() {
              if [[ "$1" == render ]]; then
                  docker compose exec -T render curl -fsS http://localhost:8000/health
              else
                  curl -fsS http://127.0.0.1:8000/api/health
              fi
          }
          version_field() { sed -n 's/.*"version":"\([^"]*\)".*/\1/p'; }

          reported=""
          for i in 1 2 3 4 5 6; do
              reported="$(health_of "$SERVICE" | version_field || true)"
              [[ "$reported" == "$VERSION" ]] && break
              sleep 5
          done
          if [[ "$reported" != "$VERSION" ]]; then
              echo "health check FAILED — $SERVICE reports '${reported:-nothing}', expected '$VERSION'" >&2
              false
          fi
          echo "health check: OK ($SERVICE $reported)"

          # A live render, still under the restore trap: a healthy container
          # that cannot compile is what this catches. A backend release is
          # asked through the public path, so the whole chain — policy,
          # proxy, compiler — answers for itself; a render release is asked
          # from inside its own container, since the backend in front of it
          # is not what changed.
          if [[ "$SERVICE" == render ]]; then
              docker compose exec -T render curl -fsS -X POST http://localhost:8000/render \
                  -H 'Content-Type: application/json' \
                  -d '{"template":"_block","data":{"lang":"sv","body":[{"type":"heading","text":"deploy check"}]}}' \
                  > /tmp/deploy-render-check.pdf
          else
              curl -fsS -X POST http://127.0.0.1:8000/api/render \
                  -H 'Content-Type: application/json' \
                  -d '{"template":"_block","data":{"lang":"sv","body":[{"type":"heading","text":"deploy check"}]}}' \
                  > /tmp/deploy-render-check.pdf
          fi
          head -c 4 /tmp/deploy-render-check.pdf | grep -q '%PDF' || {
              echo "render did not return a PDF"; head -c 200 /tmp/deploy-render-check.pdf; false
          }
          echo "render check: OK ($(stat -c%s /tmp/deploy-render-check.pdf) bytes of PDF)"
          rm -f /tmp/deploy-render-check.pdf

          # Both cores, side by side. They have to be the same version:
          # discovery schemas come from one, the renderer from the other. A
          # core bump is rolled out render first, so a backend release is
          # where a mismatch has to stop — a render release may legitimately
          # be a step ahead for the rest of the day.
          backend_health="$(health_of backend)"
          render_health="$(health_of render)"
          echo "backend health: $backend_health"
          echo "render  health: $render_health"

          if [[ "$SERVICE" == backend ]]; then
              core_field() { sed -n 's/.*"klartex":"\([^"]*\)".*/\1/p'; }
              backend_core="$(printf '%s' "$backend_health" | core_field)"
              render_core="$(printf '%s' "$render_health" | core_field)"
              if [[ -z "$backend_core" || "$backend_core" != "$render_core" ]]; then
                  echo "klartex differs — backend '${backend_core:-nothing}', render '${render_core:-nothing}'" >&2
                  false
              fi
              echo "klartex check: OK (both on $backend_core)"
          fi

          trap - ERR
          REMOTE

      - name: Report version
        run: echo "Deployed ${{ github.ref_name }} (${{ needs.resolve.outputs.service }} ${{ needs.resolve.outputs.version }}) to production" >> "$GITHUB_STEP_SUMMARY"
