# klartex.se production stack.
# Deployed to ~klartex/klartex/docker-compose.yml on the Hetzner server.
# Pinned version comes from .env (BACKEND_VERSION); never use :latest in prod.

services:
  backend:
    image: ghcr.io/swedev/klartex-se-backend:${BACKEND_VERSION}
    container_name: klartex-se-backend
    restart: unless-stopped
    # Resource caps for the render workload. The host is a cax11
    # (2 vCPU, 4 GB), so OS + Caddy keep ~1.5 GB and half a core.
    # memswap_limit == mem_limit disables swap: a render that blows the
    # cap is OOM-killed rather than thrashing the disk.
    cpus: "1.5"
    mem_limit: 2560m
    memswap_limit: 2560m
    pids_limit: 256
    # Bind to loopback only — Caddy is the public entrypoint.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      PAGE_TEMPLATES_DIR: /data/page-templates
    volumes:
      # Persistent storage for uploaded page-template bundles.
      # Lives outside the container so docker compose pull doesn't wipe them.
      - ./page-templates:/data/page-templates
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # Built on the server: rate limiting needs a third-party module that
    # the official image does not carry. Never pushed to a registry.
    build: ./caddy
    image: klartex-se-caddy:local
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/klartex/site:/srv/site:ro          # static landing page
      - /home/klartex/app:/srv/app:ro            # frontend dist
      - ./caddy-data:/data              # certificates
      - ./caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
