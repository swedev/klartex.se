[project]
name = "klartex-se-backend"
version = "0.10.0"
description = "HTTP backend for klartex.se — policy and discovery in front of the klartex render service"
requires-python = ">=3.12"
dependencies = [
    "klartex==0.19.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "httpx>=0.27",       # the client that reaches the render service
    "sqlalchemy>=2.0",
    "alembic>=1.13",     # the image runs `alembic upgrade head` on deploy
    "psycopg[binary]>=3.2",
    "email-validator>=2.0",  # pydantic's EmailStr, used by the sign-in routes
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # tests/test_contract.py drives the core's render app in-process, which
    # needs the core's serve extra. httpx is a runtime dependency already.
    "klartex[serve]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klartex_se"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
