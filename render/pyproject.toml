[project]
name = "klartex-se-render"
version = "0.1.0"
description = "Stateless HTTP wrapper around klartex.render() — compiles LaTeX, holds no secrets"
requires-python = ">=3.12"
dependencies = [
    "klartex==0.15.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # for FastAPI TestClient
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klartex_render"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
