# klartex.se production stack.
# Deployed to ~klartex/klartex/docker-compose.yml on the Hetzner server.
# Pinned versions come from .env; never use :latest in prod.
#
# Resource budget: the host is a cax11 (2 vCPU, 3.7 GiB usable), and every
# cap below is a ceiling rather than a reservation. The memory ceilings sum
# to 3072m, leaving ~700m for the OS, Docker and Caddy — comfortable in
# practice, where the measured peaks are render 517m, backend 52m and caddy
# 13m. render carries the bulk of the ceiling because it is the only
# service that compiles; postgres holds accounts and pairings in 512m.
#
# backend keeps 768m because of the bundle path, not its idle footprint: a
# bundle at the registry limits (MAX_ASSETS=10 x MAX_ASSET_BYTES=5 MB, plus
# a 1 MB template) is ~68 MB once base64-encoded, and the decoded copy, the
# encoded mapping and the serialized JSON body are all live at once. The
# in-flight cap of 2 admits two of those concurrently, which is what sets
# the ceiling. Lowering it means lowering MAX_ASSETS, MAX_ASSET_BYTES or
# MAX_INFLIGHT_RENDERS first.
#
# The CPU quotas sum to 2.5 on 2 vCPU, so they are deliberately
# oversubscribed: backend and postgres are idle whenever render is busy,
# and capping them at a true share would only slow the paths that never
# compete.
# memswap_limit == mem_limit disables swap throughout: a render that blows
# its cap is OOM-killed rather than thrashing the disk.

services:
  postgres:
    # Accounts, sessions and parla's machines and grants. The family
    # convention (styrla, tutti): pinned major, named volume, no published
    # port — the database is reachable from backend on the compose network
    # and nowhere else. Admin access is `docker compose exec postgres psql`.
    image: postgres:18-alpine
    container_name: klartex-postgres
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    environment:
      POSTGRES_USER: klartex
      POSTGRES_DB: klartex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env — see infra/README.md}
    volumes:
      # A named volume, not a bind mount, so an rsync of the deploy
      # directory can never reach the data. PG18 expects the mount at
      # /var/lib/postgresql with the data in a version-specific subdir.
      # A volume is persistence, not a backup — the deploy dumps to
      # /home/klartex/db-backups/ before every migration.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klartex -d klartex"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  render:
    # The klartex core's own artifact, built and published by swedev/klartex
    # at every release. Nothing in this repo builds it, and KLARTEX_VERSION
    # is not a version series of its own: it is the `klartex==` pin from
    # backend/pyproject.toml, which ci.yml checks against .env.example and
    # every backend deploy writes to .env.
    image: ghcr.io/swedev/klartex-render:${KLARTEX_VERSION:?set KLARTEX_VERSION in .env — see infra/README.md}
    container_name: klartex-render
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 1792m
    memswap_limit: 1792m
    pids_limit: 256
    # No ports, no volumes, no environment: this is the process that runs
    # caller-controlled LaTeX, and it is reachable only from backend over
    # an internal network with no route out.
    networks:
      - render
    # Hardening on top of that. read_only leaves the container without a
    # writable rootfs, so /tmp (per-request asset directories) and HOME
    # (fontconfig's cache) are tmpfs; without a writable HOME fontconfig
    # logs "No writable cache directories" on every run.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/render:size=64m,mode=1777
    healthcheck:
      # The same probe the image bakes in — a healthcheck: block here
      # overrides it, and the base carries no curl.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ghcr.io/swedev/klartex-se-backend:${BACKEND_VERSION}
    container_name: klartex-se-backend
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 128
    depends_on:
      render:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - default
      - render
    # Bind to loopback only — Caddy is the public entrypoint.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional. Unset: the latex block answers 403 for everyone and
      # page-template writes answer 503. Set: the token unlocks both.
      API_TOKEN: ${API_TOKEN:-}
      # Accounts and pairings. The same variable the deploy's `alembic
      # current` / `alembic upgrade head` runs read, so preflight, migration
      # and the serving process can never reach different databases.
      DATABASE_URL: postgresql://klartex:${POSTGRES_PASSWORD}@postgres:5432/klartex
      # The HMAC key over sign-in codes. Required, and required here rather
      # than defaulted, because a process that starts without it would mint
      # codes that no restart and no second worker can verify.
      LOGIN_CODE_SECRET: ${LOGIN_CODE_SECRET:?set LOGIN_CODE_SECRET in .env — see infra/README.md}
      # The public origin: the session cookie's Secure flag and the
      # same-origin test on the auth endpoints both read it.
      BASE_URL: ${BASE_URL:-https://app.klartex.se}
      # The only account state that is configuration rather than a row.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Sign-in codes are mailed; without SMTP nobody can sign in.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-kontakt@klartex.se}
      PAGE_TEMPLATES_DIR: /data/page-templates
      # The default the image already carries; spelled out because it is
      # the one line that says where compilation happens.
      RENDER_URL: http://render:8000
    volumes:
      # Persistent storage for uploaded page-template bundles.
      # Lives outside the container so docker compose pull doesn't wipe them.
      - ./page-templates:/data/page-templates
    healthcheck:
      # A healthcheck here overrides the image's, so it has to be the same
      # probe: the backend runs on python:3.12-slim, which has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # Built on the server: rate limiting needs a third-party module that
    # the official image does not carry. Never pushed to a registry.
    build: ./caddy
    image: klartex-se-caddy:local
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/klartex/site:/srv/site:ro          # static landing page
      - /home/klartex/app:/srv/app:ro            # frontend dist
      - ./caddy-data:/data              # certificates
      - ./caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
  # No gateway: a process here can reach backend and nothing else. It is
  # the one thing that keeps caller-controlled LaTeX from reaching the
  # internet, whatever it manages to read inside its own container. The
  # database is not on it, so no LaTeX run can address postgres at all.
  render:
    internal: true
