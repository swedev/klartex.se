# klartex.se production stack.
# Deployed to ~klartex/klartex/docker-compose.yml on the Hetzner server.
# Pinned versions come from .env (BACKEND_VERSION, RENDER_VERSION); never
# use :latest in prod. The two services carry independent version series
# and are released by separate tags — see infra/README.md.
#
# Resource budget: the host is a cax11 (2 vCPU, 4 GB), and every cap below
# is a ceiling rather than a reservation. The memory ceilings sum to 3328m,
# which leaves ~0.7 GB for the OS, Docker and Caddy if both services
# saturate at once, and the two 1.5 CPU quotas over-subscribe the 2 vCPU.
# Both are deliberate for as long as only one of the two actually
# compiles: render is deployed beside a backend that still compiles
# in-process, so its own ceiling is headroom waiting for the proxy. The
# caps settle at render 1792m / 1.5 CPU and backend 768m / 0.5 CPU once
# backend only proxies, which puts the sum back at today's 2560m.
# memswap_limit == mem_limit disables swap throughout: a render that blows
# its cap is OOM-killed rather than thrashing the disk.

services:
  # Compiles LaTeX, and nothing else. No secrets in its environment, no
  # volumes, no published port, and an internal-only network: a process
  # running caller-supplied LaTeX has nowhere to send anything it reads.
  render:
    image: ghcr.io/swedev/klartex-se-render:${RENDER_VERSION:?set RENDER_VERSION in infra/.env — deploy render-v* before the backend that proxies to it}
    container_name: klartex-se-render
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 256
    networks:
      - render
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    image: ghcr.io/swedev/klartex-se-backend:${BACKEND_VERSION}
    container_name: klartex-se-backend
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 1792m
    memswap_limit: 1792m
    pids_limit: 256
    networks:
      - default
      - render
    # Bind to loopback only — Caddy is the public entrypoint.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Optional. Unset: the latex block answers 403 for everyone and
      # page-template writes answer 503. Set: the token unlocks both.
      API_TOKEN: ${API_TOKEN:-}
      PAGE_TEMPLATES_DIR: /data/page-templates
    volumes:
      # Persistent storage for uploaded page-template bundles.
      # Lives outside the container so docker compose pull doesn't wipe them.
      - ./page-templates:/data/page-templates
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    # Built on the server: rate limiting needs a third-party module that
    # the official image does not carry. Never pushed to a registry.
    build: ./caddy
    image: klartex-se-caddy:local
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/klartex/site:/srv/site:ro          # static landing page
      - /home/klartex/app:/srv/app:ro            # frontend dist
      - ./caddy-data:/data              # certificates
      - ./caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

networks:
  # The bridge Caddy and backend share, and the only one reachable from
  # the host.
  default:
  # Carries backend → render and nothing else. `internal: true` gives it
  # no gateway, so render has no route off the host.
  render:
    internal: true
